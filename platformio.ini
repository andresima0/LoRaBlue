; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = receiver

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ ^6.6.0

; ==========================================================
; TRANSMITTER — CISTERN (id=1)
; Same transmitter.cpp as the Tank build below, but compiled with
; DEVICE_ID=DEVICE_ID_CISTERN so it tags its own TelemetryData.id and
; reads pump_status instead of turbidity. Flash this env onto the
; Cistern board.
; ==========================================================
[env:transmitter_cistern]
build_src_filter = +<*.cpp> -<receiver.cpp> -<radio_rx.cpp> -<bt.cpp> -<main.cpp>
build_flags = -DDEVICE_ID=DEVICE_ID_CISTERN
lib_deps =
    ${env.lib_deps}
    sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor @ ^1.2.9

; ==========================================================
; TRANSMITTER — TANK (id=2)
; Same transmitter.cpp as the Cistern build above, but compiled with
; DEVICE_ID=DEVICE_ID_TANK so it tags its own TelemetryData.id and reads
; turbidity instead of pump_status. Flash this env onto the Tank board.
; ==========================================================
[env:transmitter_tank]
build_src_filter = +<*.cpp> -<receiver.cpp> -<radio_rx.cpp> -<bt.cpp> -<main.cpp>
build_flags = -DDEVICE_ID=DEVICE_ID_TANK
lib_deps =
    ${env.lib_deps}
    sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor @ ^1.2.9

; ==========================================================
; RECEIVER / GATEWAY
; Single firmware — routes both Cistern and Tank packets by their
; TelemetryData.id field, forwarding the matching BLE JSON schema.
; ==========================================================
[env:receiver]
build_src_filter = +<*.cpp> -<transmitter.cpp> -<radio_tx.cpp> -<sensors.cpp> -<main.cpp>
build_flags = -Wextra -Wall -Wno-unused-parameter
lib_deps =
    ${env.lib_deps}